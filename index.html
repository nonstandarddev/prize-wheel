<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="https://livejs.com/live.js"></script>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
    <title>Spin the wheel!</title>
</head>

<body>
    <div id="root">
        <figure class="wheel-container">
            <div class="wheel-ticker">&darr;</div>
            <ul class="wheel">
            </ul>
        </figure>
        <button class="spin">Spin me!</button>
        <div class="message">
            <p class="result"></p>
            <p class="action"></p>
        </div>
    </div>
</body>

</html>
